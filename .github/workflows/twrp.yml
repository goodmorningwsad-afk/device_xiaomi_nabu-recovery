name: Build TWRP for Xiaomi Pad 5 (Nabu)

on:
  workflow_dispatch:

env:
  # TWRP 官方核心源码（12.1分支目前完美兼容 A12-A15 的底层解密）
  MANIFEST_URL: 'https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git'
  MANIFEST_BRANCH: 'twrp-12.1'
  
  # 自动指向设备树仓库和当前分支
  DEVICE_TREE_URL: 'https://github.com/goodmorningwsad-afk/device_xiaomi_nabu-recovery'
  DEVICE_TREE_BRANCH: 'android-12.1'
  
  # 物理坐标配置
  DEVICE_PATH: 'device/xiaomi/nabu'
  DEVICE_NAME: 'nabu'
  MAKEFILE_NAME: 'twrp_nabu'
  
  # Nabu 是 A/B 分区，没有独立 recovery 分区，所以必须打包成 bootimage
  BUILD_TARGET: 'bootimage'

jobs:
  build:
    name: Build TWRP
    # 🚨 物理环境替换：宿主机用最新，内部套 20.04 绝对隔离容器
    runs-on: ubuntu-latest
    container: ubuntu:focal
    permissions:
      contents: write

    steps:
    - name: ⏰ 检出代码
      uses: actions/checkout@v4

    - name: ⚙️ 配置编译环境 
      run: |
        export DEBIAN_FRONTEND=noninteractive
        export TZ=Etc/UTC

        apt-get update
        
        apt-get install -y git ccache automake flex lzop bison gperf build-essential zip curl zlib1g-dev g++-multilib libxml2-utils bzip2 libbz2-dev libbz2-1.0 libghc-bzlib-dev squashfs-tools pngcrush schedtool dpkg-dev liblz4-tool make optipng maven libssl-dev pwgen libswitch-perl policycoreutils minicom libxml-sax-base-perl libxml-simple-perl bc libc6-dev-i386 lib32ncurses5-dev libx11-dev lib32z-dev libgl1-mesa-dev xsltproc unzip device-tree-compiler wget cpio p7zip p7zip-full libtinfo5 sudo python3
        
        apt-get install -y python2
        rm -rf /usr/bin/python
        ln -s /usr/bin/python2.7 /usr/bin/python
        
        curl https://storage.googleapis.com/git-repo-downloads/repo > /usr/local/bin/repo
        chmod a+x /usr/local/bin/repo
        
    - name: 🌳 初始化 TWRP 核心源码树
      run: |
        mkdir workspace
        cd workspace
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        repo init --depth=1 -u ${{ env.MANIFEST_URL }} -b ${{ env.MANIFEST_BRANCH }}
        repo sync -j$(nproc --all) --force-sync

    - name: 🌿 注入 Nabu 设备树
      run: |
        cd workspace
        git clone -b ${{ env.DEVICE_TREE_BRANCH }} ${{ env.DEVICE_TREE_URL }} ${{ env.DEVICE_PATH }}

    - name: 📦 注入内核源码 (修复 generated_kernel_includes 报错)
      run: |
        cd workspace
        echo "==== 正在填补内核 ===="
        git clone --depth=1 https://github.com/goodmorningwsad-afk/kernel_xiaomi_nabu-ki.git -b derp15.1 kernel/xiaomi/nabu

    - name: ⚡ 挂载 ccache 编译缓存加速引擎
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        max-size: "5G"
        key: twrp-ccache-${{ runner.os }}-${{ github.sha }}
        restore-keys: twrp-ccache-${{ runner.os }}-

    - name: 🚀 编译！
      shell: bash 
      run: |
        cd workspace
        
        export USE_CCACHE=1
        export CCACHE_EXEC=/usr/bin/ccache
        ccache -M 50G
        
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        lunch ${{ env.MAKEFILE_NAME }}-eng
        mka ${{ env.BUILD_TARGET }} -j$(nproc --all)

    - name: 📤 提取并上传 
      uses: actions/upload-artifact@v4
      with:
        name: TWRP-Recovery-Nabu
        path: workspace/out/target/product/${{ env.DEVICE_NAME }}/boot.img
